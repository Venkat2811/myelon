name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build_and_test:
    name: Build + Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (workspace, default features)
        run: cargo build --workspace --exclude competitive-bench --verbose
      - name: Test (workspace lib + bins, default features)
        run: cargo test --workspace --exclude competitive-bench --lib --bins --verbose

# Miri is deferred to v0.1.0-alpha.2: disruptor-mp calls shm_open / mmap as
# foreign functions, which Miri rejects with "unsupported operation: can't
# call foreign function on OS linux". The plan is to carve out a Miri-only
# test target covering just the pure pointer-math helpers (cursor arithmetic,
# slot indexing, frame math) and have a separate workflow run it. Tracked
# under Safety & quality gates Tier 2 in CHANGELOG.
