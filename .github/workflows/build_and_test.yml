name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build_and_test:
    name: Build + Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (workspace, default features)
        run: cargo build --workspace --exclude competitive-bench --verbose
      - name: Test (workspace lib + bins, default features)
        run: cargo test --workspace --exclude competitive-bench --lib --bins --verbose

  miri:
    name: Miri (Linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Miri (nightly)
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
          cargo miri setup
      - name: Miri test (disruptor-mp lib)
        run: cargo miri test -p disruptor-mp --lib
