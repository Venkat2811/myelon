name: DST

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "--cfg dst"

jobs:
  dst:
    name: Deterministic-simulation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace, cfg dst)
        run: cargo check --workspace
      - name: cargo test (disruptor-mp + myelon-dst, cfg dst)
        run: cargo test -p disruptor-mp -p myelon-dst --lib
