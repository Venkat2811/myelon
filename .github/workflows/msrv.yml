name: MSRV

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Check on declared rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read workspace rust-version
        id: msrv
        run: |
          rv=$(grep -E '^rust-version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "rust_version=$rv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.rust_version }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        run: cargo check --workspace --locked
