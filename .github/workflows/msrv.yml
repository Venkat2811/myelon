name: MSRV

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Check on declared rust-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Read workspace rust-version
        id: msrv
        run: |
          rv=$(grep -E '^rust-version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "rust_version=$rv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.rust_version }}
      - uses: Swatinem/rust-cache@v2
      # MSRV gate scopes to the published surface (disruptor-mp + myelon)
      # because the workspace pulls in dev-deps (shmipc, etc.) with higher
      # MSRVs that aren't part of the public crate contract.
      - name: cargo check on MSRV (publishable crates, all features)
        run: cargo check -p disruptor-mp -p myelon --locked --all-features
