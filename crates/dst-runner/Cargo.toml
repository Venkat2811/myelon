[package]
name        = "dst-runner"
version     = "0.1.0"
description = "Internal: multiprocess deterministic-simulation test runner for disruptor-mp and myelon."
publish     = false
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
disruptor_mp = { package = "disruptor-mp", path = "../disruptor-mp" }
dst-fixtures = { path = "../dst-fixtures" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
libc = "0.2"

[features]
default = []
dst = ["disruptor_mp/dst"]

[lib]
name = "dst_runner"
