[package]
name = "dst-runner"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Real multiprocess deterministic-surface test runner for disruptor-mp and myelon"

[dependencies]
disruptor_mp = { package = "disruptor-mp", path = "../disruptor-mp" }
dst-fixtures = { path = "../dst-fixtures" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
libc = "0.2"

[features]
default = []
dst = ["disruptor_mp/dst"]

[lib]
name = "dst_runner"
