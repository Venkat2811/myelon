[package]
name        = "myelon"
# 0.1.0-alpha.1 is the initial OSS-publish version. Pre-release tag
# signals "API may evolve during the early-iteration window." See
# CHANGELOG.md.
version     = "0.1.0-alpha.2"
description = "Ultra-low-latency and high-throughput typed transport for multiprocess SHM and mmap. Layers framing, codecs, typed zero-copy, and inference-fabric topology helpers on disruptor-mp's LMAX-Disruptor-style ring substrate."
readme      = "README.md"
categories  = ["data-structures", "concurrency", "encoding", "artificial-intelligence", "algorithms"]
keywords    = ["ipc", "shared-memory", "disruptor", "inference", "zero-copy"]
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
disruptor_mp = { package = "disruptor-mp", path = "../disruptor-mp", version = "0.1.0-alpha.2" }
serde = { version = "1", features = ["derive"] }
rkyv = { version = "0.8", features = ["bytecheck"], optional = true }
flatbuffers = { version = "25.12", optional = true }

[features]
default = []
rkyv = ["dep:rkyv"]
flatbuffers = ["dep:flatbuffers"]

[dev-dependencies]
trybuild = "1.0"
serde_json = "1"
bincode = "1"

[lib]
name = "myelon"

# Workspace-level runnable examples live in the top-level `examples/`
# crate so they can demonstrate `disruptor-mp` and `myelon` together.

# DST harness — see disruptor-mp's matching block for the rationale.
# Workspace devs run `RUSTFLAGS="--cfg dst" cargo test` to pull this in;
# default publish builds don't activate the cfg.
[target.'cfg(dst)'.dev-dependencies]
myelon-dst = { path = "../myelon-dst" }

# Render all optional features (rkyv / flatbuffers) on docs.rs so the
# published documentation matches the full surface.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
