[package]
name        = "perf-bench"
version     = "0.1.0"
description = "Internal performance benchmark suite for the disruptor-mp and myelon transport stack. Consolidates pingpong, broadcast, and signal scenarios across raw-ring, framed, codec, and typed-zero-copy layers, with both SHM and mmap backends."
readme      = "README.md"
publish     = false
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Transport layers
disruptor_mp = { package = "disruptor-mp", path = "../disruptor-mp" }
myelon = { path = "../myelon", features = ["rkyv", "flatbuffers"] }
myelon-env = { path = "../myelon-env", version = "0.1.0-alpha.1" }

# Serialization (for codec e2e benchmarks)
rkyv = { version = "0.8", features = ["bytecheck"] }
flatbuffers = "24.12"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Benchmark infrastructure
hdrhistogram = "7.5"
tabled = "0.20.0"
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
num-format = "0.4"
shared_memory = "0.12"
libc = "0.2"
ctrlc = "3.4"

[lib]
name = "perf_bench"

[[bin]]
name = "perf-bench-pingpong"
path = "src/bin/pingpong.rs"

[[bin]]
name = "perf-bench-broadcast"
path = "src/bin/broadcast.rs"

[[bin]]
name = "perf-bench-signal"
path = "src/bin/signal.rs"
