[package]
name = "perf-bench"
version = "0.1.0"
edition = "2021"
description = "Performance benchmark suite for the Myelon transport stack (disruptor-mp + myelon)"
license = "MIT"
publish = false

[dependencies]
# Transport layers
disruptor_mp = { package = "disruptor-mp", path = "../disruptor-mp" }
myelon = { path = "../myelon", features = ["rkyv", "flatbuffers"] }

# Serialization (for codec e2e benchmarks)
rkyv = { version = "0.8", features = ["bytecheck"] }
flatbuffers = "24.12"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Benchmark infrastructure
hdrhistogram = "7.5"
tabled = "0.20.0"
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
num-format = "0.4"
shared_memory = "0.12"
libc = "0.2"
ctrlc = "3.4"

[lib]
name = "perf_bench"

# --- disruptor-mp layer: raw ring, no framing ---

[[bench]]
name = "raw_ring_shm"
path = "benches/disruptor_mp/shm/raw_ring.rs"
harness = false

[[bench]]
name = "raw_ring_mmap"
path = "benches/disruptor_mp/mmap/raw_ring.rs"
harness = false

[[bench]]
name = "wait_strategy_shm"
path = "benches/disruptor_mp/shm/wait_strategy.rs"
harness = false

[[bench]]
name = "wait_strategy_mmap"
path = "benches/disruptor_mp/mmap/wait_strategy.rs"
harness = false

[[bench]]
name = "competitive_shm"
path = "benches/disruptor_mp/shm/competitive.rs"
harness = false

[[bench]]
name = "competitive_mmap"
path = "benches/disruptor_mp/mmap/competitive.rs"
harness = false

# --- myelon layer: framed + codec ---

[[bench]]
name = "framed_shm"
path = "benches/myelon/framed/shm.rs"
harness = false

[[bench]]
name = "framed_mmap"
path = "benches/myelon/framed/mmap.rs"
harness = false

[[bench]]
name = "codec_e2e_shm"
path = "benches/myelon/codec/shm.rs"
harness = false

[[bench]]
name = "codec_e2e_mmap"
path = "benches/myelon/codec/mmap.rs"
harness = false

[[bench]]
name = "codec_nofrag_shm"
path = "benches/myelon/codec/nofrag_shm.rs"
harness = false

# --- cross-cutting ---

[[bench]]
name = "monster_sweep_shm"
path = "benches/sweep/shm.rs"
harness = false

[[bench]]
name = "monster_sweep_mmap"
path = "benches/sweep/mmap.rs"
harness = false

[[bench]]
name = "layout_validation"
path = "benches/layout/validation.rs"
harness = false
