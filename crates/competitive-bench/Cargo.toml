[package]
name = "competitive-bench"
version = "0.1.0"
edition = "2021"
description = "Parity-oriented IPC benchmark orchestrator for mp_ipc_world_domination-style comparisons"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = true }
clap = { version = "4", features = ["derive"] }
crossbar = { path = "third_party/crossbar" }
disruptor_mp = { package = "disruptor-mp", path = "../disruptor-mp" }
futures-util = "0.3"
hdrhistogram = "7"
iggy = "0.10.0"
libc = "0.2"
myelon = { path = "../myelon", features = ["rkyv", "flatbuffers"] }
perf-bench = { path = "../perf-bench" }
rskafka = "0.6.0"
rusteron-client = "0.1.162"
rusteron-media-driver = "0.1.162"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shmipc = "0.1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zmq = "0.10.0"

[target.'cfg(unix)'.dependencies]
iceoryx2 = "0.8.1"

[lib]
name = "competitive_bench"
