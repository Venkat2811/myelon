[package]
name        = "competitive-bench"
version     = "0.1.0"
description = "Internal IPC benchmark harness comparing disruptor-mp against external transports (crossbar, shmipc, rusteron, iceoryx2, zeromq, boost message_queue, ompi) on a fixed `1p1c` ping-pong and `1p4c`/`1p8c` broadcast contract."
readme      = "README.md"
publish     = false
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = true }
clap = { version = "4", features = ["derive"] }
crossbar = { path = "third_party/crossbar" }
disruptor_mp = { package = "disruptor-mp", path = "../disruptor-mp" }
hdrhistogram = "7"
libc = "0.2"
myelon = { path = "../myelon", features = ["rkyv", "flatbuffers"] }
perf-bench = { path = "../perf-bench" }
rusteron-client = "0.1.162"
rusteron-media-driver = "0.1.162"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shmipc = "0.1.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zmq = "0.10.0"

[target.'cfg(unix)'.dependencies]
iceoryx2 = "0.9.0"

[lib]
name = "competitive_bench"
