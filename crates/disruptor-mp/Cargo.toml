[package]
name          = "disruptor-mp"
# 0.1.0-alpha.1 is the initial OSS-publish version. Previously this
# Cargo.toml carried 3.7.1 inherited from the upstream `disruptor`
# crate this fork started from; reset to 0.1.0-alpha.x for the first
# crates.io publish to signal "first public release, API may evolve"
# rather than masquerading as a mature 3.x. See CHANGELOG.md.
version       = "0.1.0-alpha.1"
description   = "Ultra-low-latency and high-throughput multiprocess ring-buffer substrate over SHM and mmap (LMAX Disruptor design, extended cross-process), with cross-process producer/consumer coordination, required-consumer liveness, and observability counters."
readme        = "README.md"
categories    = ["data-structures", "concurrency", "memory-management", "algorithms"]
keywords      = ["disruptor", "ringbuffer", "ipc", "shared-memory", "lock-free"]
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "disruptor_mp"

[features]
default = ["metrics"]

# RFC 0040 — observability
# Counters layer is always present (~2 ns/op relaxed atomic). The
# optional features below add the aggregator thread + metrics-rs
# facade and exporter glue. Compiling with `--no-default-features`
# removes the metrics-rs facade entirely (`benchmark-pure` profile in
# the RFC).
metrics             = ["dep:metrics"]
metrics-prometheus  = ["metrics", "dep:metrics-exporter-prometheus"]
metrics-otel        = ["metrics", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# ============================================================================
# CORE DEPENDENCIES
# ============================================================================

[dependencies]
# Upstream core disruptor (single-process/threaded APIs).
# This crate adds multiprocess shared-memory support on top.
disruptor_core = { package = "disruptor", version = "4.2.0" }
thiserror = "2.0"
once_cell = "1.21"

# Multi-process support (always enabled)
shared_memory = { version = "0.12.4" }
memmap2       = { version = "0.9.10" }
libc          = { version = "0.2.173" }

# RFC 0040 — observability (all gated behind features above).
metrics                       = { version = "0.24",  optional = true }
metrics-exporter-prometheus   = { version = "0.18",  optional = true }
opentelemetry                 = { version = "0.32",  optional = true }
opentelemetry_sdk             = { version = "0.32",  optional = true, features = ["rt-tokio"] }
opentelemetry-otlp            = { version = "0.32",  optional = true, features = ["metrics"] }

# ============================================================================
# PLATFORM-SPECIFIC DEPENDENCIES
# ============================================================================

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31" }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winnt", "synchapi", "handleapi"] }

[target.'cfg(target_os = "linux")'.dependencies]
core_affinity = { version = "0.8.3" }

# ============================================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================================

[dev-dependencies]
# Benchmarking framework
criterion = "0.5"

# Testing utilities
crossbeam = "0.8"
rand = "0.9"
trybuild = "1.0"

# IPC benchmark dependencies
hdrhistogram = "7.5"
tabled = "0.20.0"
shared-mem-queue = "0.4.0"
num-format = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Competitive benchmark dependencies
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
ctrlc = "3.4"

# RFC 0040 — for verifying the aggregator emits via the metrics-rs facade.
metrics-util = "0.19"

# Per-layer benchmarks live in `crates/perf-bench` (broad sweep) and
# `crates/competitive-bench` (apples-to-apples external comparison).
# Workspace-level examples that run against this crate (and `myelon`)
# live in the top-level `examples/` crate.

# Deterministic-simulation primitives (BUGGIFY, AssertionLog,
# DST contract types, scenario profiles, runtime context) live in
# `src/dst/` and are compiled into the lib only when the consumer's
# build sets `RUSTFLAGS="--cfg dst"`. They need serde for trace
# serialization.
#
# Pattern: TigerBeetle ships VOPR primitives with the database; this
# crate ships its DST primitives with the substrate. Crates.io
# consumers who want to use BUGGIFY in their own testing can opt in
# the same way.
[target.'cfg(dst)'.dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Multiprocess DST harness (drives the workspace's DST test runs).
# Internal-only; only used by integration tests.
[target.'cfg(dst)'.dev-dependencies]
myelon-dst = { path = "../myelon-dst" }

# Render all optional features (metrics / Prometheus / OpenTelemetry / OTLP)
# on docs.rs so the published documentation matches the full surface.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
