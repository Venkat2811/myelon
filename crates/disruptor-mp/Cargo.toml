[package]
name          = "disruptor-mp"
version       = "3.7.1"
edition       = "2021"
description   = "Low latency multiprocess communication via shared-memory ring buffers (LMAX disruptor-inspired)."
license       = "MIT"
authors       = ["venkat"]
repository    = "https://github.com/Venkat2811/myelon"
categories    = ["data-structures", "concurrency"]
keywords      = ["disruptor", "ringbuffer", "message", "mpmc"]

[lib]
name = "disruptor_mp"

[features]
default = ["metrics"]
dst = ["dep:dst-fixtures"]

# RFC 0040 — observability
# Counters layer is always present (~2 ns/op relaxed atomic). The
# optional features below add the aggregator thread + metrics-rs
# facade and exporter glue. Compiling with `--no-default-features`
# removes the metrics-rs facade entirely (`benchmark-pure` profile in
# the RFC).
metrics             = ["dep:metrics"]
metrics-prometheus  = ["metrics", "dep:metrics-exporter-prometheus"]
metrics-otel        = ["metrics", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# ============================================================================
# CORE DEPENDENCIES
# ============================================================================

[dependencies]
# Upstream core disruptor (single-process/threaded APIs).
# This crate adds multiprocess shared-memory support on top.
disruptor_core = { package = "disruptor", version = "3.7.1" }
thiserror = "1.0"
once_cell = "1.19"

# Multi-process support (always enabled)
shared_memory = { version = "0.12.4" }
memmap2       = { version = "0.9.5" }
libc          = { version = "0.2.173" }
dst-fixtures  = { path = "../dst-fixtures", optional = true }

# RFC 0040 — observability (all gated behind features above).
metrics                       = { version = "0.24",  optional = true }
metrics-exporter-prometheus   = { version = "0.16",  optional = true }
opentelemetry                 = { version = "0.27",  optional = true }
opentelemetry_sdk             = { version = "0.27",  optional = true, features = ["rt-tokio"] }
opentelemetry-otlp            = { version = "0.27",  optional = true, features = ["metrics"] }

# ============================================================================
# PLATFORM-SPECIFIC DEPENDENCIES
# ============================================================================

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1" }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winnt", "synchapi", "handleapi"] }

[target.'cfg(target_os = "linux")'.dependencies]
core_affinity = { version = "0.8.1" }

# ============================================================================
# DEVELOPMENT DEPENDENCIES
# ============================================================================

[dev-dependencies]
# Benchmarking framework
criterion = "0.5"

# Testing utilities
crossbeam = "0.8"
rand = "0.8"
trybuild = "1.0"

# IPC benchmark dependencies
hdrhistogram = "7.5"
tabled = "0.20.0"
shared-mem-queue = "0.4.0"
num-format = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dst-fixtures = { path = "../dst-fixtures" }

# Competitive benchmark dependencies
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
ctrlc = "3.4"

# RFC 0040 — for verifying the aggregator emits via the metrics-rs facade.
metrics-util = "0.19"

# ============================================================================
# PROFILES
# ============================================================================

# ============================================================================
# BENCHMARKS
# ============================================================================

[[bench]]
name = "ipc_shm"
path = "benches/ipc/ipc_shm.rs"
harness = false

[[bench]]
name = "ipc_shm_high_load"
path = "benches/ipc/ipc_shm_high_load.rs"
harness = false

[[bench]]
name = "competitor_vs_rust_benchmark"
path = "benches/competitor/competitor_vs_rust_benchmark.rs"
harness = false

[[bench]]
name = "benchmark_all_wait_strategies_auto_rust"
path = "benches/ipc/benchmark_all_wait_strategies_auto.rs"
harness = false

[[bench]]
name = "layout_validation"
path = "benches/layout_validation.rs"
harness = false

# Competitive benchmarks for industry comparison
[[bench]]
name = "competitive_pingpong"
path = "benches/ipc/competitive/benchmark_pingpong.rs"
harness = false

# ============================================================================
# EXAMPLES
# ============================================================================

[[example]]
name = "counters"
path = "examples/counters.rs"

[[example]]
name = "shared_disruptor"
path = "examples/shared_disruptor.rs"


[[example]]
name = "counters_auto"
path = "examples/counters_auto.rs"

[[example]]
name = "performance_runner"
path = "examples/performance_runner.rs"

