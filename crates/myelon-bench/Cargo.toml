[package]
name = "myelon-bench"
version = "0.1.0"
edition = "2021"
description = "Unified benchmark suite for the Myelon transport stack (disruptor-mp + myelon)"
license = "MIT"
publish = false

[dependencies]
# Transport layers
disruptor_mp = { package = "disruptor-mp", path = "../disruptor-mp" }
myelon = { path = "../myelon", features = ["rkyv", "flatbuffers"] }

# Serialization (for codec e2e benchmarks)
rkyv = { version = "0.8", features = ["bytecheck"] }
flatbuffers = "24.12"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Benchmark infrastructure
hdrhistogram = "7.5"
tabled = "0.20.0"
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
num-format = "0.4"
shared_memory = "0.12"
libc = "0.2"
ctrlc = "3.4"

[lib]
name = "myelon_bench"

[[bench]]
name = "raw_ring_shm"
harness = false

[[bench]]
name = "raw_ring_mmap"
harness = false

[[bench]]
name = "framed_shm"
harness = false

[[bench]]
name = "framed_mmap"
harness = false

[[bench]]
name = "codec_e2e_shm"
harness = false

[[bench]]
name = "codec_e2e_mmap"
harness = false

[[bench]]
name = "wait_strategy_shm"
harness = false

[[bench]]
name = "wait_strategy_mmap"
harness = false

[[bench]]
name = "competitive_shm"
harness = false

[[bench]]
name = "competitive_mmap"
harness = false

[[bench]]
name = "layout_validation"
harness = false
