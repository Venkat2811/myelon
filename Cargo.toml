[workspace]
members = [
  "crates/disruptor-mp",
  "crates/dst-runner",
  "crates/legacy-wip",
  "crates/perf-bench",
  "crates/competitive-bench",
  "crates/dst-fixtures",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.metadata]
project = "myelon"

[profile.competitive]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = false
debug-assertions = false
debug = false
panic = "abort"
strip = true
incremental = false

[patch.crates-io]
err_trail = { path = "crates/competitive-bench/patches/err_trail" }
