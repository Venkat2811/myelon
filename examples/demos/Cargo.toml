[package]
name        = "demos"
version     = "0.1.0"
description = "Workspace-level runnable examples for `disruptor-mp` and `myelon`."
publish     = false
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# Empty lib so this crate compiles cleanly even when no example is built.
path = "src/lib.rs"

[dependencies]
# Two dependency profiles deliberately demonstrated side-by-side:
#
#   `myelon`       — simplified façade. Single dep gives the full
#                    Layer 0 + Layers 1–3 + topology + observability
#                    surface via re-exports. Used by shm_disruptor,
#                    mmap_disruptor, pingpong, counters,
#                    fixed_inference_topology.
#
#   `disruptor-mp` — substrate-only. Reach for this directly when you
#                    want the raw cross-process ring buffer with no
#                    framing / codec / topology surface compiled in.
#                    Used by disruptor_mp_shm and disruptor_mp_mmap.
#
# The examples helper crate (`src/lib.rs`) imports through `myelon::*`,
# but the helper types it uses (`SharedConsumer`, `attach_shared_consumer`)
# are the *same* types in either crate — myelon re-exports them — so the
# substrate-only examples can use the helpers without conversion.
disruptor-mp = { path = "../../crates/disruptor-mp" }
myelon       = { path = "../../crates/myelon" }

[[example]]
name = "shm_disruptor"
path = "shm_disruptor.rs"

[[example]]
name = "mmap_disruptor"
path = "mmap_disruptor.rs"

[[example]]
name = "disruptor_mp_shm"
path = "disruptor_mp_shm.rs"

[[example]]
name = "disruptor_mp_mmap"
path = "disruptor_mp_mmap.rs"

[[example]]
name = "pingpong"
path = "pingpong.rs"

[[example]]
name = "counters"
path = "counters.rs"

[[example]]
name = "fixed_inference_topology"
path = "fixed_inference_topology.rs"

[[example]]
name = "required_consumer_liveness"
path = "required_consumer_liveness.rs"
